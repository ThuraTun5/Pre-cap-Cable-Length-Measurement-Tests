; T07 - One TMC2209 (UART) + one stepper motor
;
; Board: Freenove ESP32-WROOM board (ESP32-WROOM-32E module).

[env:esp32dev]
platform = platformio/espressif32 @ 6.13.0   ; pinned: Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
lib_deps =
    teemuatlut/TMCStepper @ 0.7.3              ; TMC2209 registers over UART
    gin66/FastAccelStepper @ 1.3.4             ; step pulses in hardware, with acceleration

monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
