; T10 - Everything together: encoder (mm) + both motors + USB protocol v2 in one program
;
; Board: Freenove ESP32-WROOM board (ESP32-WROOM-32E module).

[env:esp32dev]
platform = platformio/espressif32 @ 6.13.0   ; pinned: Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
lib_deps =
    madhephaestus/ESP32Encoder @ 0.11.8       ; encoder in the pulse counter (PCNT)
    teemuatlut/TMCStepper @ 0.7.3              ; TMC2209 over UART
    gin66/FastAccelStepper @ 1.3.4             ; step pulses (RMT driver: leaves PCNT to the encoder)

monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
