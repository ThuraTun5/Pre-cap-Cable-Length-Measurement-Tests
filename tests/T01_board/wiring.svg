<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <title>T01 wiring: USB only</title>
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#222">T01 wiring — USB cable only</text>

  <!-- PC -->
  <rect x="40" y="110" width="150" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="115" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">PC</text>
  <text x="115" y="177" text-anchor="middle" font-size="12" fill="#444441">VS Code + PlatformIO</text>

  <!-- USB cable -->
  <line x1="190" y1="160" x2="330" y2="160" stroke="#378ADD" stroke-width="4"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#185FA5">USB-C data cable</text>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#185FA5">(power + data)</text>

  <!-- Board -->
  <rect x="330" y="70" width="190" height="200" rx="8" fill="#2C2C2A" stroke="#000"/>
  <rect x="370" y="80" width="110" height="70" rx="4" fill="#D3D1C7"/>
  <text x="425" y="120" text-anchor="middle" font-size="12" fill="#2C2C2A">ESP32-WROOM-32E</text>
  <circle cx="380" cy="190" r="7" fill="#378ADD"/>
  <text x="394" y="194" font-size="12" fill="#fff">IO2 blue LED (GPIO 2)</text>
  <circle cx="380" cy="218" r="7" fill="#E24B4A"/>
  <text x="394" y="222" font-size="12" fill="#fff">RGB LED (GPIO 16)</text>
  <circle cx="380" cy="246" r="7" fill="#97C459"/>
  <text x="394" y="250" font-size="12" fill="#fff">ON power LED</text>
  <text x="425" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Freenove ESP32 WROOM</text>

  <!-- Note -->
  <rect x="545" y="110" width="115" height="100" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="602" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">Nothing else</text>
  <text x="602" y="160" text-anchor="middle" font-size="12" fill="#791F1F">connected to</text>
  <text x="602" y="180" text-anchor="middle" font-size="12" fill="#791F1F">any pin</text>

  <text x="340" y="335" text-anchor="middle" font-size="12" fill="#444441">Place the board on a non-conductive surface (table, paper, plastic) — not on metal or black foam.</text>
</svg>
