; T06 - USB serial link to the Raspberry Pi: JSON Lines protocol v1 (see docs/PROTOCOL.md)
;
; Board: Freenove ESP32-WROOM board (ESP32-WROOM-32E module).

[env:esp32dev]
platform = platformio/espressif32 @ 6.13.0   ; pinned: Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
lib_deps =
    madhephaestus/ESP32Encoder @ 0.11.8       ; uses the ESP32 hardware pulse counter (PCNT)

monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
