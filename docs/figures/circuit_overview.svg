<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <!-- Colour rules: red = + supply, black = ground (-), blue = signal, grey = motor coils.
       Every component uses the same box style. -->
  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- title -->
  <text x="80" y="82" font-size="44" font-weight="700" fill="#1d2228">Cable-length jig: circuit overview</text>
  <text x="80" y="124" font-size="24" fill="#5f6368">ESP32 side: encoder for the length, two synchronised clamp-head motors, number display, USB link to the Raspberry Pi</text>

  <!-- ================= wires (under the boxes) ================= -->
  <g fill="none" stroke-linejoin="round">
    <!-- USB: Pi -> ESP32 (5 V, GND, data) -->
    <path d="M420 250 H1004 V380" stroke="#d62828" stroke-width="6"/>
    <path d="M420 262 H992 V380"  stroke="#111111" stroke-width="6"/>
    <path d="M420 274 H980 V380"  stroke="#2563c9" stroke-width="6"/>

    <!-- encoder -> 74LVC245 -> ESP32: A, B, X -->
    <path d="M400 525 H500 M400 550 H500 M400 575 H500" stroke="#2563c9" stroke-width="5"/>
    <path d="M700 525 H780 M700 550 H780 M700 575 H780" stroke="#2563c9" stroke-width="5"/>

    <!-- 3.3 V to the 74LVC245 (inner U) -->
    <path d="M800 660 V690 H600 V610" stroke="#d62828" stroke-width="5"/>
    <path d="M812 660 V702 H588 V610" stroke="#111111" stroke-width="5"/>
    <!-- 5 V to the encoder (outer U) -->
    <path d="M852 660 V732 H252 V620" stroke="#d62828" stroke-width="5"/>
    <path d="M864 660 V744 H240 V620" stroke="#111111" stroke-width="5"/>

    <!-- ESP32 -> display: CLK, DIO, 3.3 V, GND -->
    <path d="M1000 660 V800 M1020 660 V800" stroke="#2563c9" stroke-width="5"/>
    <path d="M1080 660 V800" stroke="#d62828" stroke-width="5"/>
    <path d="M1095 660 V800" stroke="#111111" stroke-width="5"/>

    <!-- ESP32 -> drivers: control bundle (STEP, DIR, UART, EN) -->
    <path d="M1220 520 H1355 M1355 440 V620 M1355 440 H1420 M1355 620 H1420" stroke="#2563c9" stroke-width="8" stroke-linecap="round"/>

    <!-- 3.3 V logic power: ESP32 -> driver 1 -> driver 2 -->
    <path d="M1150 380 V340 H1472 V380" stroke="#d62828" stroke-width="5"/>
    <path d="M1162 380 V352 H1460 V380" stroke="#111111" stroke-width="5"/>
    <path d="M1472 500 V560" stroke="#d62828" stroke-width="5"/>
    <path d="M1460 500 V560" stroke="#111111" stroke-width="5"/>

    <!-- 24 V motor power: supply -> driver 1 -> driver 2 -->
    <path d="M1575 290 V380 M1575 500 V560" stroke="#d62828" stroke-width="9"/>
    <path d="M1557 290 V380 M1557 500 V560" stroke="#111111" stroke-width="9"/>

    <!-- drivers -> motors -->
    <path d="M1640 440 H1730 M1640 620 H1730" stroke="#8a9096" stroke-width="10"/>
  </g>
  <circle cx="1355" cy="520" r="8" fill="#2563c9"/>

  <!-- ================= components (one style) ================= -->
  <g fill="#f4f5f3" stroke="#30363d" stroke-width="3">
    <rect x="80"   y="200" width="340" height="130" rx="14"/>
    <rect x="80"   y="480" width="320" height="140" rx="14"/>
    <rect x="500"  y="490" width="200" height="120" rx="14"/>
    <rect x="780"  y="380" width="440" height="280" rx="14"/>
    <rect x="880"  y="800" width="340" height="110" rx="14"/>
    <rect x="1420" y="190" width="220" height="100" rx="14"/>
    <rect x="1420" y="380" width="220" height="120" rx="14"/>
    <rect x="1420" y="560" width="220" height="120" rx="14"/>
    <rect x="1730" y="380" width="150" height="120" rx="14"/>
    <rect x="1730" y="560" width="150" height="120" rx="14"/>
  </g>

  <g fill="#1d2228" font-weight="700" text-anchor="middle">
    <text x="250"  y="256" font-size="30">Raspberry Pi 5</text>
    <text x="240"  y="534" font-size="28">AMT102-V encoder</text>
    <text x="600"  y="542" font-size="26">74LVC245</text>
    <text x="1000" y="440" font-size="38">ESP32</text>
    <text x="1050" y="850" font-size="40" font-family="Courier New, monospace">1003.4</text>
    <text x="1530" y="236" font-size="27">24 V supply</text>
    <text x="1530" y="432" font-size="27">TMC2209 #1</text>
    <text x="1530" y="612" font-size="27">TMC2209 #2</text>
    <text x="1805" y="434" font-size="24">Motor 1</text>
    <text x="1805" y="614" font-size="24">Motor 2</text>
  </g>
  <g fill="#5f6368" text-anchor="middle">
    <text x="250"  y="294" font-size="21">web UI · database · camera</text>
    <text x="240"  y="570" font-size="20">on the slider pulley · 5 V</text>
    <text x="240"  y="600" font-size="19">8192 counts per 40 mm</text>
    <text x="600"  y="578" font-size="20">5 V → 3.3 V</text>
    <text x="1000" y="476" font-size="21">Freenove WROOM-32E</text>
    <text x="1000" y="530" font-size="21">counts the encoder</text>
    <text x="1000" y="562" font-size="21">drives both motors in sync</text>
    <text x="1000" y="594" font-size="21">sends length + motor state to the Pi</text>
    <text x="1000" y="626" font-size="21">shows the length on the display</text>
    <text x="1050" y="886" font-size="20">TM1637 6-digit display</text>
    <text x="1530" y="270" font-size="19">motors only</text>
    <text x="1530" y="466" font-size="19">UART address 0</text>
    <text x="1530" y="646" font-size="19">UART address 1</text>
    <text x="1805" y="464" font-size="17">clamp head</text>
    <text x="1805" y="644" font-size="17">clamp head</text>
  </g>

  <!-- ================= wire labels (clear space only) ================= -->
  <g font-size="18" fill="#30363d">
    <text x="460" y="236" font-size="21" font-weight="700">USB cable: 5 V + data</text>
    <text x="460" y="304">JSON lines, 115200 baud</text>
    <text x="450" y="508" text-anchor="middle">A · B · X</text>
    <text x="740" y="508" text-anchor="middle">3.3 V</text>
    <text x="576" y="668" text-anchor="end">3.3 V</text>
    <text x="545" y="774" text-anchor="middle">5 V for the encoder</text>
    <text x="990" y="760" text-anchor="end">CLK · DIO</text>
    <text x="1110" y="760">3.3 V</text>
    <text x="1230" y="556" font-size="17">STEP · DIR</text>
    <text x="1230" y="580" font-size="17">UART · EN</text>
    <text x="1250" y="324">3.3 V logic</text>
    <text x="1450" y="536" text-anchor="end">3.3 V</text>
    <text x="1595" y="342">24 V</text>
    <text x="1595" y="536">24 V</text>
    <text x="1685" y="424" text-anchor="middle">coils</text>
    <text x="1685" y="604" text-anchor="middle">coils</text>
  </g>

  <!-- ================= legend + notes ================= -->
  <g font-size="20" fill="#30363d">
    <line x1="80"  y1="962" x2="124" y2="962" stroke="#d62828" stroke-width="6"/><text x="136" y="969">+ supply (24 V, 5 V, 3.3 V)</text>
    <line x1="430" y1="962" x2="474" y2="962" stroke="#111111" stroke-width="6"/><text x="486" y="969">ground (−)</text>
    <line x1="640" y1="962" x2="684" y2="962" stroke="#2563c9" stroke-width="6"/><text x="696" y="969">signal</text>
    <line x1="800" y1="962" x2="844" y2="962" stroke="#8a9096" stroke-width="10"/><text x="856" y="969">motor coils</text>
  </g>
  <g font-size="20" fill="#5f6368">
    <text x="80" y="1008">• Two power sources: the Pi (USB 5 V) feeds all logic; the 24 V supply feeds only the motors. The grounds join inside the drivers.</text>
    <text x="80" y="1042">• Length = fixed offset + slider travel from the encoder, target ≤ 1 mm per 1000 mm. A 2 s watchdog stops the motors if the USB link drops.</text>
  </g>
</svg>
